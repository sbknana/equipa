name: Tests

# Least-privilege token: the pytest step runs arbitrary repo code (SR-2699 S1).
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    # No THEFORGE_DB here: tests/conftest.py forces every run onto a throwaway
    # temp DB before equipa is imported. (The old job-level
    # `${{ runner.temp }}` value made this workflow file invalid: the runner
    # context is not allowed in job env, so no job ever ran.)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest suite
        # Mirrors the local invocation exactly (pytest -q --durations=15).
        # Output is teed to a file for the failure artifact. `shell: bash`
        # is REQUIRED: only an explicit bash shell runs with `-o pipefail`.
        # Without it the step's status was tee's, so a failing pytest
        # reported green (seen on the first real run: 1 failed, job passed).
        shell: bash
        run: |
          pytest -q --durations=15 | tee "$RUNNER_TEMP/pytest-output.txt"
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-output-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pytest-output.txt
          if-no-files-found: warn
