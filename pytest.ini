[pytest]
# The suite has async tests (@pytest.mark.asyncio). Without pytest-asyncio they
# fail, or on older pytest they are skipped and read as green. Refuse to start
# instead. Install with: pip install -r requirements-dev.txt
#
# pytest-xdist runs the full suite in parallel, one isolated test DB per
# worker (tests/conftest.py). The full suite takes over 10 minutes serially,
# longer than one agent Bash call may run, so the documented invocation is
#   python3 -m pytest -q -p no:cacheprovider -n auto --dist loadfile
# It is not in addopts: a single test file runs faster without workers.
required_plugins = pytest-asyncio>=0.23 pytest-xdist>=3.8
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
testpaths = tests
